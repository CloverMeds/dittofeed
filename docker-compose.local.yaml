# Build and run this checkout. See docs/local-docker.md.
name: dittofeed-local

services:
  lite:
    image: dittofeed-local:checkout
    build:
      context: .
      dockerfile: packages/lite/Dockerfile
      args:
        APP_VERSION: ${DITTOFEED_APP_VERSION:-local-checkout}
        NODE_BUILD_IMAGE: node:20.19.5-bookworm
        NODE_RUNTIME_IMAGE: node:20.19.5-bookworm-slim
    init: true
    restart: unless-stopped
    command: node --max-old-space-size=2048 ./packages/lite/dist/scripts/startLite.js --workspace-name=Default
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: local-postgres-password
      DATABASE_NAME: dittofeed
      CLICKHOUSE_HOST: http://clickhouse-server:8123
      CLICKHOUSE_USER: dittofeed
      CLICKHOUSE_PASSWORD: local-clickhouse-password
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      WORKSPACE_NAME: Default
      AUTH_MODE: single-tenant
      PASSWORD: local-dittofeed
      # Public local-development value, never use for a shared deployment.
      SECRET_KEY: GEGL1RHjFVOxIO80Dp8+ODlZPOjm2IDBJB/UunHlf3c=
      DASHBOARD_URL: http://localhost:3000
      DASHBOARD_API_BASE: http://localhost:3000
      BOOTSTRAP: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse-server:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    logging:
      driver: local

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-password
      POSTGRES_DB: dittofeed
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dittofeed"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: local

  clickhouse-server:
    image: clickhouse/clickhouse-server:24.12.6.70-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: dittofeed
      CLICKHOUSE_PASSWORD: local-clickhouse-password
    volumes:
      - clickhouse:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: local

  temporal:
    image: temporalio/auto-setup:1.22.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: local-postgres-password
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/dev.yaml
    volumes:
      - ./packages/backend-lib/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    logging:
      driver: local

  temporal-ui:
    image: temporalio/ui:2.22.1
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: local

volumes:
  postgres:
  clickhouse:
  clickhouse-logs:
